[build]
  publish = "."

# Always build production. Netlify's default ignore compares the new commit
# with the shared build cache. After a deploy preview, that cache is the PR
# head. A squash merge has the same file tree, so production is skipped as
# "no content change" and the live site stays on the previous publish.
# Exit 1 tells Netlify the build should continue.
[context.production]
  ignore = "exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The browser checks this file for app updates. A long cache would hide them.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
