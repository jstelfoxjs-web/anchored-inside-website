media:
  - name: handouts
    label: Handouts
    input: assets/handouts
    output: /assets/handouts
    rename: safe
    categories:
      - image
      - document

content:
  - name: toolbox
    label: Toolbox Handouts
    type: file
    path: data/resources.json
    format: json
    list: true

    fields:
      - name: title
        label: Handout title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: audience
        label: Audience tags
        type: string
        list: true
        required: true
      - name: topics
        label: Topic tags
        type: select
        required: true
        options:
          multiple: true
          min: 1
          max: 3
          placeholder: Select 1–3 topics
          values:
            - name: anxiety
              label: Anxiety
            - name: depression-mood
              label: Depression & Mood
            - name: trauma
              label: Trauma
            - name: attachment
              label: Attachment
            - name: regulation
              label: Regulation
            - name: impulse-control
              label: Impulse Control
            - name: parenting
              label: Parenting
            - name: relationships
              label: Relationships
            - name: boundaries
              label: Boundaries
            - name: self-compassion
              label: Self-Compassion
            - name: grief
              label: Grief
            - name: mindfulness
              label: Mindfulness
            - name: neurodiversity
              label: Neurodiversity
            - name: act
              label: ACT
            - name: dbt
              label: DBT
            - name: cbt
              label: CBT
      - name: type
        label: Resource type
        type: string
        required: true
      - name: file
        label: Handout file
        type: file
        required: true
      - name: preview
        label: Preview image (optional)
        type: image
        required: false
      - name: keywords
        label: Search keywords
        type: string
        list: true
        required: false
      - name: featured
        label: Featured
        type: boolean
        default: false
