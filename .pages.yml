media:
  - name: handouts
    label: Handouts
    input: assets/handouts
    output: /assets/handouts
    rename: safe
    categories:
      - image
      - document

content:
  - name: toolbox
    label: Toolbox Handouts
    type: file
    path: data/resources.json
    format: json
    list: true

    fields:
      - name: title
        label: Handout title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: audience
        label: Audience tags
        type: select
        required: true
        options:
          multiple: true
          min: 1
          max: 3
          placeholder: Select audience tags
          values:
            - name: all
              label: Everyone
            - name: parents
              label: Parents
            - name: adults
              label: Adults
            - name: teens
              label: Teens
            - name: families
              label: Families
            - name: couples
              label: Couples
      - name: topics
        label: Topic tags
        type: select
        required: true
        options:
          multiple: true
          min: 1
          max: 3
          placeholder: Select 1–3 topics
          values:
            - name: anxiety
              label: Anxiety
            - name: depression-mood
              label: Depression & Mood
            - name: trauma
              label: Trauma
            - name: attachment
              label: Attachment
            - name: nervous-system
              label: Nervous System
            - name: brain-development
              label: Brain Development
            - name: regulation
              label: Regulation
            - name: impulse-control
              label: Impulse Control
            - name: executive-functioning
              label: Executive Functioning
            - name: social-emotional-skills
              label: Social-Emotional Skills
            - name: parenting
              label: Parenting
            - name: relationships
              label: Relationships
            - name: communication
              label: Communication
            - name: boundaries
              label: Boundaries
            - name: values
              label: Values
            - name: self-compassion
              label: Self-Compassion
            - name: grief
              label: Grief
            - name: mindfulness
              label: Mindfulness
            - name: neurodiversity
              label: Neurodiversity
            - name: act
              label: ACT
            - name: dbt
              label: DBT
            - name: cbt
              label: CBT
            - name: emdr
              label: EMDR
            - name: ifs-parts-work
              label: IFS / Parts Work
            - name: play-therapy
              label: Play Therapy
            - name: somatic
              label: Somatic
      - name: type
        label: Resource type
        type: select
        required: true
        options:
          values:
            - name: Psychoeducation
              label: Psychoeducation
            - name: Worksheet
              label: Worksheet
            - name: Activity
              label: Activity
            - name: Guide
              label: Guide
            - name: Assessment
              label: Assessment
            - name: Parent guide
              label: Parent guide
            - name: Skill guide
              label: Skill guide
            - name: Visual handout
              label: Visual handout
            - name: Reflective handout
              label: Reflective handout
            - name: Visual reminder
              label: Visual reminder
            - name: Family reflection
              label: Family reflection
            - name: Relationship handout
              label: Relationship handout
            - name: Parent reflection
              label: Parent reflection
      - name: file
        label: Handout file
        type: file
        required: true
      - name: preview
        label: Preview image (optional)
        type: image
        required: false
      - name: keywords
        label: Search keywords
        type: string
        list: true
        required: false
      - name: featured
        label: Featured
        type: boolean
        default: false
